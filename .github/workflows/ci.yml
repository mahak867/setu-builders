name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest httpx
      - name: Unit, rule and adversarial-case tests (offline, rules fallback)
        run: cd backend && python -m pytest -q
      - name: Safety evaluation, rules fallback (dev and held-out sets)
        run: python eval/run_eval.py && python eval/run_eval.py holdout
